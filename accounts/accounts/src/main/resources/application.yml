server:
  port: 8080

spring:
  profiles:
    active: "prod"

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: user
    password: password

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


  application:
    name: "accounts"

  config:
    import: "optional:configserver:http://localhost:8071/"
