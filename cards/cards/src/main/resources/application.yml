server:
  port: 9000
spring:

  profiles:
    active: "prod"

  datasource:
    url: jdbc:h2:mem:mydb
    driverClassName: org.h2.Driver
    username: user
    password: password
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import: "optional:configserver:http://localhost:8071/"
  application:
    name: "cards"

management:
  endpoints:
    web:
      exposure:
        include: "*"