server:
  port: 9000
spring:

#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

  profiles:
    active: "prod"

  datasource:
    url: jdbc:mysql://localhost:3308/cardsdb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import: "optional:configserver:http://localhost:8071/"
  application:
    name: "cards"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
  info:
    env:
      enabled: true


eureka:
  instance:
  preferIpAddress: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "cards"
    description: "IOB Cards Service"
    version: 1.0.0


