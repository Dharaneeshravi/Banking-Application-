server:
  port: 8090
spring:
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: user
    password: password
  h2:
    console:
      enabled: true
  hibernate:
    ddl-auto: update
  show-sql: true

  application:
    name: loans

  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
