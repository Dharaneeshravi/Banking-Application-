server:
  port: 8090
spring:

#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

  profiles:
    active: "prod"
  datasource:
    url: jdbc:mysql://localhost:3307/loansdb
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: loans

  config:
    import: "optional:configserver:http://localhost:8071/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true

  info:
    env:
      enabled: true



eureka:
  instance:
  preferIpAddress: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

info:
  app:
    name: "loans"
    description: "IOB Loans Service"
    version: 1.0.0



